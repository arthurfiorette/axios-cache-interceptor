name: Code CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          install: true

      - name: Lint
        run: pnpm lint-ci

      - name: Test Types
        run: pnpm test:types

      - name: Test
        run: pnpm test

      - name: Build code
        run: pnpm build

      - name: Publish to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
