name: 'CodeQL'

on:
  push:
    branches: [main]
    paths: ['**.js', '**.jsx', '**.ts', '**.tsx']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0/12 * * *'

permissions: write-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          install: true

      - name: Build
        run: pnpm build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3
